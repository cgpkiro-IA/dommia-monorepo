services:
  postgres:
    image: postgres:16-alpine
    container_name: dommia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dommia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dommia_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dommia_master}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - ./docker/migrations:/docker-entrypoint-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dommia_admin} -d ${POSTGRES_DB:-dommia_master}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dommia_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dommia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dommia_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dommia_master}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dommia-local-auth-secret-change-me}
      RESIDENT_APP_TOKEN_SECRET: ${RESIDENT_APP_TOKEN_SECRET:-dommia-local-resident-app-auth-secret-change-me}
      RESIDENT_APP_URL: ${RESIDENT_APP_URL:-http://localhost:3003}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}
      SAAS_SMTP_HOST: ${SAAS_SMTP_HOST:-smtp.porkbun.com}
      SAAS_SMTP_PORT: ${SAAS_SMTP_PORT:-587}
      SAAS_SMTP_USER: ${SAAS_SMTP_USER:-}
      SAAS_SMTP_PASSWORD: ${SAAS_SMTP_PASSWORD:-}
      SAAS_SMTP_FROM: ${SAAS_SMTP_FROM:-}
    ports:
      - "${API_PORT:-4000}:4000"

  emqx:
    image: emqx/emqx:5.8.5
    container_name: dommia_emqx
    restart: always
    environment:
      EMQX_NAME: dommia_broker
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER:-dommia_admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:-dommia_mqtt_pass_2026}
    ports:
      - "1883:1883"    # MQTT TCP
      - "8883:8883"    # MQTT SSL/TLS
      - "8083:8083"    # MQTT WebSocket
      - "8084:8084"    # MQTT WSS
      - "18083:18083"  # EMQX Dashboard Web UI
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
